name: Build and Deploy Chatbot

on:
  push:
    branches: [slots]  # Your main branch
  pull_request:
    branches: [slots]
  workflow_dispatch:  # Allow manual trigger

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # JOB 1: Build Frontend (React Widget)
  # ============================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React widget
        working-directory: ./frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-widget
          path: backend/assets/chat-widget.js
          retention-days: 7

  # ============================================
  # JOB 2: Test Backend (Python)
  # ============================================
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt found, skipping"

      - name: Check Python syntax
        run: |
          python -m py_compile fastapi_chatbot.py
          echo "Python syntax check passed"

  # ============================================
  # JOB 3: Deploy to Server (only on slots branch push)
  # ============================================
  deploy:
    needs: [build-frontend, test-backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/slots'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: chat-widget
          path: backend/assets/

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "Starting deployment..."
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git pull origin slots
            cd frontend && npm ci && npm run build && cd ..
            source venv/bin/activate || true
            pm2 restart chatbot || pm2 start "uvicorn fastapi_chatbot:app --host 0.0.0.0 --port 8000" --name chatbot
            echo "Deployment complete!"
