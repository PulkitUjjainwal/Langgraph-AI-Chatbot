# Nginx Configuration for EG Chatbot
# Copy to: /etc/nginx/sites-available/eg-chatbot
# Enable with: sudo ln -s /etc/nginx/sites-available/eg-chatbot /etc/nginx/sites-enabled/

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=chatbot_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chatbot_widget:10m rate=30r/s;

# ============================================================
# Backend API Server
# ============================================================
upstream chatbot_api {
    server 127.0.0.1:8000 fail_timeout=30s;
    keepalive 32;
}

# ============================================================
# HTTP Server (Redirects to HTTPS in production)
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name chatbot.exportgenius.in;  # Change to your domain

    # For SSL certificate verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect to HTTPS (uncomment after SSL setup)
    # location / {
    #     return 301 https://$server_name$request_uri;
    # }

    # ============================================================
    # API Endpoints
    # ============================================================
    location /api/ {
        limit_req zone=chatbot_api burst=20 nodelay;

        proxy_pass http://chatbot_api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (increase for LLM responses)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming
        proxy_buffering off;

        # CORS Headers (allow all origins for widget)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # ============================================================
    # Chat Widget Static Files
    # ============================================================
    location /widget/ {
        limit_req zone=chatbot_widget burst=50 nodelay;

        alias /opt/eg-chatbot/widget-dist/;

        # Cache static assets
        expires 1d;
        add_header Cache-Control "public, immutable";

        # CORS for widget loading
        add_header Access-Control-Allow-Origin * always;

        # Correct MIME type for JavaScript
        types {
            application/javascript js;
        }
    }

    # Serve chat-widget.js directly at root for convenience
    location = /chat-widget.js {
        alias /opt/eg-chatbot/widget-dist/chat-widget.js;

        expires 1h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin * always;

        types {
            application/javascript js;
        }
    }

    # ============================================================
    # Health Check (no logging, no rate limit)
    # ============================================================
    location = /api/health {
        proxy_pass http://chatbot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============================================================
    # Docs (Swagger UI)
    # ============================================================
    location /docs {
        proxy_pass http://chatbot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://chatbot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Logging
    access_log /var/log/nginx/chatbot_access.log;
    error_log /var/log/nginx/chatbot_error.log;
}

